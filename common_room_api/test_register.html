
<!DOCTYPE html>
<html>
<head>
    <title>Common Room Registration Test</title>
</head>
<body>

    <h2>Test Common Room Registration</h2>

    <form id="registerForm">
        <p>
            <input type="text" id="name"
                   placeholder="Full Name" required>
        </p>

        <p>
            <input type="email" id="email"
                   placeholder="Email" required>
        </p>

        <p>
            <input type="password" id="password"
                   placeholder="Password (8+ characters)" required>
        </p>

        <button type="submit">Register</button>
    </form>

    <pre id="result"></pre>

    <script>
        document.getElementById("registerForm")
        .addEventListener("submit", async function(e) {

            e.preventDefault();

            const result = document.getElementById("result");
            result.textContent = "Please wait...";

            try {
                const response = await fetch("register.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: document.getElementById("name").value,
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                result.textContent =
                    "HTTP Status: " + response.status +
                    "\nMessage: " + (data.message || "No message") +
                    "\nDatabase Error: " + (data.error || "No detailed error returned");

            } catch (error) {
                result.textContent = "Request failed: " + error.message;
            }
        });
    </script>

</body>
</html>
